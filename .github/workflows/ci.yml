name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint, typecheck, tests & coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wms_pro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wms_pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wms_pro_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test:cov
      - run: npm run build
      - run: npm audit --audit-level critical
      - name: Diff coverage ≥ 80%
        if: github.event_name == 'pull_request'
        # Report-only until picking/packing/products have tests (see docs/TESTING.md).
        continue-on-error: true
        run: |
          pip install diff-cover
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 80

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: wms-pro-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha
      - name: Smoke test the API container
        run: |
          docker network create wms
          docker run -d --name db --network wms -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wms_pro postgres:16-alpine
          until docker exec db pg_isready -U postgres; do sleep 2; done
          docker build --target migrate -t wms-pro-backend:migrate .
          docker run --rm --network wms -e DATABASE_URL=postgresql://postgres:postgres@db:5432/wms_pro wms-pro-backend:migrate
          docker run -d --name api --network wms -p 3000:3000             -e DATABASE_URL=postgresql://postgres:postgres@db:5432/wms_pro             -e JWT_SECRET=$(openssl rand -hex 32) -e JWT_REFRESH_SECRET=$(openssl rand -hex 32)             wms-pro-backend:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && exit 0; sleep 2; done
          docker logs api
          exit 1
